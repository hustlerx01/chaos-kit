name: chaos
on:
  push: {branches: [main]}
  schedule: [{cron: "0 3 * * 1"}]   # weekly game-day
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && pytest -q
  experiments:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m chaos.runner experiments/*.yml --modes off,tuned --duration 8
      - name: Tuned gateway must hold the hypothesis under every fault
        run: python -c "import json,sys;r=[x for x in json.load(open('results/chaos_results.json')) if x['resilience']=='tuned'];sys.exit(0 if all(x['during_ok'] and x['recovered'] for x in r) else 1)"
      - run: cat results/chaos_report.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: {name: chaos-results, path: results/}
